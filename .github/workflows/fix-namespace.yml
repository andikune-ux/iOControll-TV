name: Fix Namespace Global

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Global replace
        run: |
          find app/src -name "*.kt" -exec sed -i 's/com\.example/dev.andikuneiocontroll/g' {} +
          sed -i 's|namespace = "com.example"|namespace = "dev.andikuneiocontroll"|' app/build.gradle.kts
          echo "=== Cek sisa com.example ==="
          grep -r "com\.example" app/src app/build.gradle.kts || echo "BERSIH!"

      - name: Commit & Push
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Global fix: com.example -> dev.andikuneiocontroll" || echo "Tidak ada perubahan"
          git push
