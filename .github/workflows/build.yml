# ============================================================
# GitHub Actions Workflow — iOControll Tv
# Build Debug & Release APK otomatis
# ============================================================

name: Build iOControll Tv APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Gradle
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Buat debug.keystore otomatis (365000 hari)
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. Izin eksekusi gradlew
      - name: Grant Execute Permission for gradlew
        run: chmod +x ./gradlew

      # 7. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 8. Upload Debug APK sebagai Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOControllTv-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 9. Build Release APK (unsigned)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # 10. Upload Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: iOControllTv-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # 11. Upload Test Reports (jika ada)
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
