name: Build iOControll Tv APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Prepare Keystore (Permanent)
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "✅ Keystore permanen ditemukan. Decoding..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "⚠️ Keystore belum ada. Membuat keystore permanen baru..."
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w 0 debug.keystore > debug.keystore.base64
            rm -f debug.keystore
            echo "✅ Keystore permanen dibuat."
          fi

      - name: Commit Keystore (jika baru)
        run: |
          if [ -f debug.keystore.base64 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore.base64
            if git diff --cached --quiet; then
              echo "Keystore sudah ada di repo. Skip commit."
            else
              git commit -m "Add permanent debug keystore (base64) [skip ci]"
              git push
            fi
          fi

      - name: Decode Keystore untuk Build
        run: |
          if [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iOControllTv-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
