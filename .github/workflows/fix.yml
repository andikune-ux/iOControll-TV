name: Fix Namespace

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show BEFORE
        run: |
          echo "=== Package lines BEFORE ==="
          grep -rn "^package " app/src --include="*.kt"
          echo ""
          echo "=== Import com.example BEFORE ==="
          grep -rn "com\.example" app/src --include="*.kt" || echo "TIDAK ADA"

      - name: Replace ALL
        run: |
          find app/src -name "*.kt" -type f -exec sed -i 's/com\.example/dev.andikuneiocontroll/g' {} +
          sed -i 's|namespace = "com.example"|namespace = "dev.andikuneiocontroll"|' app/build.gradle.kts

      - name: Show AFTER
        run: |
          echo "=== Package lines AFTER ==="
          grep -rn "^package " app/src --include="*.kt"
          echo ""
          echo "=== Sisa com.example ==="
          grep -rn "com\.example" app/src app/build.gradle.kts || echo "BERSIH!"

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Fix namespace global" || echo "Tidak ada perubahan"
          git push
