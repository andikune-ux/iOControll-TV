syntax = "proto3";
package pairing;

option java_package = "dev.andikuneiocontroll.remote.protocol.androidtv.proto";
option java_outer_classname = "PairingMessageProto";

// ==========================================================
// PAIRING MESSAGE — sesuai protokol resmi Google TV Pairing
//
// Struktur field (WAJIB sesuai urutan ini):
//   Field 1  = protocol_version   (selalu 2 untuk Remote v2)
//   Field 2  = status             (200 = OK, 400 = ERROR, dst)
//   Field 10 = pairing_request
//   Field 11 = pairing_request_ack
//   Field 20 = pairing_option
//   Field 30 = pairing_configuration
//   Field 31 = pairing_configuration_ack
//   Field 40 = pairing_secret
//   Field 41 = pairing_secret_ack
// ==========================================================
message PairingMessage {
  uint32 protocol_version = 1;
  int32 status = 2;
  PairingRequest pairing_request = 10;
  PairingRequestAck pairing_request_ack = 11;
  PairingOption pairing_option = 20;
  PairingConfiguration pairing_configuration = 30;
  PairingConfigurationAck pairing_configuration_ack = 31;
  PairingSecret pairing_secret = 40;
  PairingSecretAck pairing_secret_ack = 41;
}

// ==========================================================
// PAIRING REQUEST (dikirim HP ke TV)
// ==========================================================
message PairingRequest {
  string service_name = 1;
  string client_name = 2;
}

// ==========================================================
// PAIRING REQUEST ACK (dari TV)
// ==========================================================
message PairingRequestAck {
  string server_name = 1;
}

// ==========================================================
// PAIRING OPTION (dari TV berisi konfigurasi encoding)
// ==========================================================
message PairingOption {
  repeated PairingEncoding input_encodings = 1;
  repeated PairingEncoding output_encodings = 2;
}

message PairingEncoding {
  // 0 = UNKNOWN, 1 = ALPHANUMERIC, 2 = NUMERIC,
  // 3 = HEXADECIMAL, 4 = QRCODE
  int32 type = 1;
  uint32 symbol_length = 2;
}

// ==========================================================
// PAIRING CONFIGURATION (dikirim HP ke TV)
// ==========================================================
message PairingConfiguration {
  PairingEncoding encoding = 1;
  // 0 = UNKNOWN, 1 = INPUT, 2 = OUTPUT
  int32 client_role = 2;
}

// ==========================================================
// PAIRING CONFIGURATION ACK (dari TV)
// ==========================================================
message PairingConfigurationAck { }

// ==========================================================
// PAIRING SECRET (dikirim HP ke TV berisi SPAKE2 message)
// ==========================================================
message PairingSecret {
  bytes secret = 1;
}

// ==========================================================
// PAIRING SECRET ACK (dari TV berisi SPAKE2 message)
// ==========================================================
message PairingSecretAck {
  bytes secret = 1;
}
